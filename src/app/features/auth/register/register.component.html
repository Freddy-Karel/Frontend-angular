<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 p-4 relative overflow-hidden">
  <!-- Decorative Background Elements -->
  <div class="absolute inset-0 overflow-hidden">
    <!-- Circles -->
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
    
    <!-- Grid Pattern -->
    <div class="absolute inset-0 opacity-5" style="background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size: 40px 40px;"></div>
    
    <!-- Floating Shapes -->
    <div class="absolute top-20 left-20 w-20 h-20 border border-white/10 rounded-2xl rotate-12 animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-16 h-16 border border-white/10 rounded-full animate-pulse delay-200"></div>
    <div class="absolute top-1/3 right-1/4 w-12 h-12 bg-white/5 rounded-lg rotate-45 animate-pulse delay-400"></div>
  </div>

  <div class="relative w-full max-w-lg">
    <!-- Card -->
    <div class="relative bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-6 border border-white/20">
      <!-- Header -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-white">Créer un compte</h2>
        <p class="text-white/60 text-xs">Rejoignez notre plateforme de gestion de projet</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-white/80 mb-1.5">Nom complet</label>
          <input type="text" formControlName="fullName" autocomplete="name"
                 class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20 outline-none transition-all text-white placeholder-white/40 text-sm"
                 placeholder="Jean Dupont">
        </div>

        <div>
          <label class="block text-xs font-medium text-white/80 mb-1.5">Email</label>
          <input type="email" formControlName="email" autocomplete="email"
                 class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20 outline-none transition-all text-white placeholder-white/40 text-sm"
                 placeholder="votre@email.com">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-white/80 mb-1.5">Mot de passe</label>
            <input type="password" formControlName="password" autocomplete="new-password"
                   class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20 outline-none transition-all text-white placeholder-white/40 text-sm"
                   placeholder="••••••••">
          </div>

          <div>
            <label class="block text-xs font-medium text-white/80 mb-1.5">Confirmer</label>
            <input type="password" formControlName="confirmPassword" autocomplete="new-password"
                   class="w-full px-3 py-2.5 bg-white/10 border border-white/20 rounded-xl focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20 outline-none transition-all text-white placeholder-white/40 text-sm"
                   placeholder="••••••••">
          </div>
        </div>

        @if (registerForm.errors?.['mismatch'] && confirmPasswordControl?.touched) {
          <p class="text-red-400 text-xs">Les mots de passe ne correspondent pas</p>
        }

        <button type="submit"
                class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-300 text-sm"
                [disabled]="loading">
          @if (loading) {
            <span class="inline-block animate-spin mr-2">⟳</span>
          }
          S'inscrire
        </button>
      </form>

      <div class="flex items-center justify-between mt-4 text-xs">
        <button (click)="router.navigate(['/login'])" 
                class="text-white/70 hover:text-white transition-colors cursor-pointer">
          Se connecter
        </button>
        <button (click)="router.navigate([''])" 
                class="text-white/70 hover:text-white transition-colors cursor-pointer flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Accueil
        </button>
      </div>
    </div>
  </div>
</div>
