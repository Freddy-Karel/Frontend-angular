@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    
    <div class="relative rounded-xl shadow-2xl w-full max-w-md p-6 animate-fade-in border"
         [style.background-color]="'var(--bg-secondary)'"
         [style.border-color]="'var(--border-color)'">
      @if (type() === 'danger') {
        <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4" [style.background-color]="'var(--error-bg)'">
          <svg class="w-6 h-6" [style.color]="'var(--error)'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
      } @else if (type() === 'warning') {
        <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4" [style.background-color]="'var(--warning-bg)'">
          <svg class="w-6 h-6" [style.color]="'var(--warning)'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
      } @else {
        <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4" [style.background-color]="'var(--accent-light)'">
          <svg class="w-6 h-6" [style.color]="'var(--accent)'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
      }
      
      <h3 class="text-xl font-bold mb-2 text-center" [style.color]="'var(--text-primary)'">{{ title() }}</h3>
      <p class="text-center mb-6" [style.color]="'var(--text-secondary)'">{{ message() }}</p>
      
      <div class="flex gap-3 justify-center">
        <button 
          type="button"
          (click)="cancel.emit()"
          class="px-6 py-2 rounded-xl transition-colors font-medium"
          [style.color]="'var(--text-primary)'"
          [style.background-color]="'var(--bg-tertiary)'">
          {{ cancelText() }}
        </button>
        <button 
          type="button"
          (click)="confirm.emit()"
          class="px-6 py-2 font-semibold rounded-xl transition-all duration-200 text-white"
          [style.background]="type() === 'danger' ? 'linear-gradient(135deg, var(--error), #DC2626)' : type() === 'warning' ? 'linear-gradient(135deg, var(--warning), #D97706)' : 'linear-gradient(135deg, var(--accent), var(--accent-hover))'">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
