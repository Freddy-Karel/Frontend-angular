<div class="flex flex-col gap-1">
  @if (label()) {
    <label class="text-sm font-medium" [style.color]="'var(--text-secondary)'">{{ label() }}</label>
  }
  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [formControl]="control()"
    class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 transition-all duration-200"
    [style.background-color]="'var(--input-bg)'"
    [style.border-color]="errorMessage() ? 'var(--error)' : 'var(--border-color)'"
    [style.color]="'var(--text-primary)'"
  />
  @if (errorMessage()) {
    <span class="text-sm" [style.color]="'var(--error)'">{{ errorMessage() }}</span>
  }
</div>
