<!-- Modal Overlay -->
@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="absolute inset-0 modal-overlay backdrop-blur-sm" (click)="closeInternal()"></div>
    
    <!-- Modal Content -->
    <div class="relative modal-content rounded-xl shadow-2xl w-full max-w-md p-6 animate-fade-in">
      <h3 class="text-xl font-bold mb-4" [style.color]="'var(--text-primary)'">Créer une liste</h3>
      
      <form (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-2" [style.color]="'var(--text-secondary)'">Titre de la liste</label>
          <input 
            id="list-title-input"
            type="text" 
            [(ngModel)]="listTitle"
            name="listTitle"
            (keydown)="onKeyDown($event)"
            class="w-full px-4 py-3 border rounded-xl focus:outline-none transition-all"
            [style.background-color]="'var(--input-bg)'"
            [style.border-color]="'var(--border-color)'"
            [style.color]="'var(--text-primary)'"
            (focus)="$any($event.target).style.borderColor = 'var(--accent)'"
            (blur)="$any($event.target).style.borderColor = 'var(--border-color)'"
            placeholder="Ex: À faire, En cours, Terminé">
        </div>
        
        <div class="flex gap-3 justify-end">
          <button 
            type="button"
            (click)="closeInternal()"
            class="px-4 py-2 font-semibold rounded-xl transition-colors"
            [style.color]="'var(--text-primary)'"
            (mouseenter)="$any($event.target).style.backgroundColor = 'var(--bg-tertiary)'"
            (mouseleave)="$any($event.target).style.backgroundColor = 'transparent'">
            Annuler
          </button>
          <button 
            type="submit"
            [disabled]="loading() || !listTitle().trim()"
            class="px-6 py-2 text-white font-semibold rounded-xl hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none btn-primary">
            @if (loading()) {
              <span class="inline-block animate-spin mr-2">⟳</span>
            }
            Créer
          </button>
        </div>
      </form>
    </div>
  </div>
}
