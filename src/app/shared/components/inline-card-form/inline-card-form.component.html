@if (isOpen()) {
  <div class="rounded-lg p-3 shadow-sm mb-2 animate-fade-in border"
       [style.background-color]="'var(--bg-secondary)'"
       [style.border-color]="'var(--border-color)'">
    <textarea 
      id="card-title-input"
      [(ngModel)]="cardTitle"
      name="cardTitle"
      (keydown)="onKeyDown($event)"
      class="w-full px-3 py-2 border rounded-lg outline-none transition-all text-sm resize-none"
      [style.background-color]="'var(--input-bg)'"
      [style.border-color]="'var(--border-color)'"
      [style.color]="'var(--text-primary)'"
      placeholder="Saisir un titre pour cette carte..."
      rows="3"
      [attr.aria-label]="'Titre de la carte'"></textarea>
    
    <div class="flex items-center justify-between mt-3">
      <div class="flex items-center gap-2">
        <button 
          (click)="onSubmit()"
          [disabled]="loading() || !cardTitle().trim()"
          class="px-4 py-1.5 text-white text-sm font-semibold rounded-lg hover:shadow-md transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed btn-primary">
          @if (loading()) {
            <span class="inline-block animate-spin mr-1">...</span>
          }
          Ajouter
        </button>
        <button 
          (click)="close()"
          class="p-1.5 rounded-lg transition-colors"
          [style.color]="'var(--text-secondary)'"
          (mouseenter)="$any($event.target).style.backgroundColor = 'var(--bg-tertiary)'"
          (mouseleave)="$any($event.target).style.backgroundColor = 'transparent'">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="flex items-center gap-1">
        <button class="p-1.5 rounded-lg transition-colors" [style.color]="'var(--text-secondary)'" title="Ajouter des labels">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
          </svg>
        </button>
        <button class="p-1.5 rounded-lg transition-colors" [style.color]="'var(--text-secondary)'" title="Ajouter une echeance">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
}
