<aside class="fixed left-0 top-0 h-full w-60 shadow-lg border-r flex flex-col"
     [style.background-color]="'var(--bg-secondary)'"
     [style.border-color]="'var(--border-color)'">
  <div class="p-6 border-b"
       [style.border-color]="'var(--border-color)'">
    <h1 class="text-2xl font-bold" [style.color]="'var(--text-primary)'">Gestion Projet</h1>
  </div>
  
  <nav class="flex-1 p-4">
    <ul class="space-y-2">
      <li>
        <a
          routerLink="/dashboard"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors"
          [style.color]="'var(--text-primary)'"
          (mouseenter)="$any($event.target).style.backgroundColor = 'var(--bg-tertiary)'"
          (mouseleave)="$any($event.target).style.backgroundColor = 'transparent'"
          routerLinkActive="active-nav-link text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>
          Tableau de bord
        </a>
      </li>
      <li>
        <a
          routerLink="/dashboard"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors"
          [style.color]="'var(--text-primary)'"
          (mouseenter)="$any($event.target).style.backgroundColor = 'var(--bg-tertiary)'"
          (mouseleave)="$any($event.target).style.backgroundColor = 'transparent'">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Créer un Board
        </a>
      </li>
    </ul>
  </nav>
  
  <div class="p-4 border-t"
       [style.border-color]="'var(--border-color)'">
    <button
      (click)="logout()"
      class="flex items-center gap-3 px-4 py-3 w-full rounded-lg transition-colors"
      [style.color]="'var(--error)'"
      (mouseenter)="$any($event.target).style.backgroundColor = 'var(--bg-tertiary)'"
      (mouseleave)="$any($event.target).style.backgroundColor = 'transparent'">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      Déconnexion
    </button>
  </div>
</aside>
