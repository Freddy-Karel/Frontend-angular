<nav class="app-navbar sticky top-0 z-50 border-b backdrop-blur-xl">
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/dashboard" class="brand-link">
      <span class="brand-mark">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
      </span>
      <span class="brand-title">Gestion Projet</span>
    </a>

    <div class="navbar-search hidden md:block">
      <input type="search"
             [value]="searchQuery()"
             (input)="onSearch($event)"
             (keyup.enter)="onSearchEnter()"
             placeholder="Rechercher un board...">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <button (click)="toggleTheme()" class="navbar-icon-button" title="Changer de theme">
        @if (currentTheme() === 'dark') {
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        } @else {
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        }
      </button>

      <app-notification-panel></app-notification-panel>

      <div class="relative">
        <button (click)="toggleDropdown()" class="navbar-user-button">
          <span class="user-avatar">{{ getInitials() }}</span>
          <span class="user-copy hidden sm:block">
            <strong>{{ user()?.fullName }}</strong>
            <small>{{ user()?.email }}</small>
          </span>
          <svg class="hidden h-4 w-4 sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        @if (isDropdownOpen) {
          <div class="navbar-dropdown absolute right-0 z-50 mt-2 w-60 rounded-lg border py-1 shadow-dropdown animate-fade-in">
            <div class="dropdown-user border-b px-4 py-3">
              <p>{{ user()?.fullName }}</p>
              <small>{{ user()?.email }}</small>
            </div>
            <a routerLink="/profile" (click)="closeDropdown()" class="navbar-menu-item">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              Mon profil
            </a>
            <a routerLink="/settings" (click)="closeDropdown()" class="navbar-menu-item">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              Parametres
            </a>
            <div class="dropdown-separator"></div>
            <button (click)="logout()" class="navbar-menu-item danger">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              Se deconnecter
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</nav>

@if (isDropdownOpen) {
  <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>
}
